<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Autocomplete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="app">

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="topbar-left">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4h10l6 6v10H4V4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M14 4v6h6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="app-title">pdf<span class="accent">type</span></span>
        </div>
        <div class="upload-zone">
            <label class="file-label" for="pdfUpload">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Choose PDF
            </label>
            <input type="file" id="pdfUpload" accept="application/pdf">
            <button class="upload-btn" onclick="uploadPDF()">Upload PDF</button>
            <button class="delete-btn" onclick="deletePDF()">Delete PDF</button>
            <span class="file-name" id="fileName">No file selected</span>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="main">

        <!-- LEFT: Editor -->
        <div class="editor-panel">
            <div class="panel-header">
                <span class="panel-label">Editor</span>
                <span class="hint">Suggestions appear as you type</span>
            </div>
            <div class="editor-wrap">
                <textarea id="editor" placeholder="Start typing — suggestions from your PDF will appear here…" spellcheck="false"></textarea>
            </div>
            <div id="suggestions"></div>
        </div>

        <!-- DIVIDER -->
        <div class="divider"></div>

        <!-- RIGHT: PDF -->
        <div class="pdf-panel">
            <div class="panel-header">
                <span class="panel-label">Document</span>
                <span class="hint" id="pageCount"></span>
            </div>
            <div class="pdf-scroll">
                <div class="pdf-inner" id="pdfContainer">
                    <div class="pdf-empty">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <p>Upload a PDF to get started</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/editor.js"></script>
<script src="/static/js/pdf_viewer.js"></script>

<script>
    // Update file name display
    document.getElementById('pdfUpload').addEventListener('change', function() {
        const name = this.files[0]?.name || 'No file selected';
        document.getElementById('fileName').textContent = name;
    });
</script>

</body>
</html>
